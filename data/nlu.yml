version: "3.1"
# Agregar variaciones ayuda a que paresca menos rigido y a que entienda mejor lo que el usuario quiere decir, aunque no lo diga exactamente igual a los ejemplos.
nlu:
- intent: saludar
  examples: |
    - hola
    - buenos días
    - buenas tardes
    - buenas
    - che hola
    - hey
    - qué tal

- intent: despedirse
  examples: |
    - chau
    - adiós
    - nos vemos
    - hasta luego
    - hasta mañana
    - terminar conversación
    - ya me voy

- intent: afirmar
  examples: |
    - sí
    - obvio
    - claro
    - me parece bien
    - dale
    - correcto

- intent: negar
  examples: |
    - no
    - para nada
    - ni loco
    - no quiero
    - paso

- intent: agradecer
  examples: |
    - gracias
    - muchas gracias
    - gracias che
    - joya, gracias
    - espectacular
    - mil gracias

- intent: consultar_precio
  examples: |
    - ¿A cuánto está el [bitcoin](crypto)?
    - decime el precio de [ethereum](crypto)
    - valor de [solana](crypto)
    - ¿cuánto vale [btc](crypto)?
    - precio de [eth](crypto) ahora
    - a cuánto cotiza [ada](crypto)
    - pasame el precio de [dot](crypto)
    - quiero saber el valor de una moneda
    - cotización de [usdt](crypto)
    - ¿cómo viene el [btc](crypto)?
    - tirame el precio de [eth](crypto)
    - decime la cotización de [sol](crypto)
    - ¿a cuánto cotiza [usdc](crypto) hoy?
    - precio de [matic](crypto)

- intent: preguntar_bienestar
  examples: |
    - ¿cómo estás?
    - ¿todo bien?
    - ¿cómo va todo?
    - ¿qué onda?
    - ¿cómo te sentís hoy?

- intent: bot_challenge
  examples: |
    - ¿sos un robot?
    - ¿sos humano?
    - ¿con quién hablo?
    - ¿sos una IA?
    - ¿quién te programó?

- intent: fuera_de_tema
  examples: |
    - ¿quién ganó el partido?
    - me gusta el helado de chocolate
    - qué clima hace en Paraná
    - contame un chiste
    - hablemos de fútbol