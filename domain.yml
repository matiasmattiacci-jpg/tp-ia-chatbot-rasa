#Aquí es donde debemos registrar todo lo que definimos anteriormente en el NLU para que Rasa sepa que existen y cómo debe responder.
#Curiosidad: Si ponés varias opciones de texto bajo la misma respuesta, Rasa elige una al azar. Esto evita que el bot parezca un disco rayado.
version: "3.1"

intents:
  - saludar
  - despedirse
  - agradecer
  - afirmar
  - negar
  - consultar_precio
  - preguntar_bienestar
  - bot_challenge
  - fuera_de_tema

entities:
  - crypto

slots:
  crypto:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: crypto

responses:
  utter_saludar:
    - text: "¡Hola! Soy tu asistente virtual de finanzas. Puedo darte el precio de criptomonedas en tiempo real. ¿Sobre cuál querés consultar?"
    - text: "¡Hola! Soy tu asistente de criptos. ¿Qué moneda estás siguiendo hoy?"
    - text: "¡Buenas! Acá firme analizando el mercado. ¿De qué cripto querés saber el precio?"

  utter_despedirse:
    - text: "¡Hasta luego! Espero haberte ayudado con tus inversiones."
  
  utter_agradecer:
    - text: "¡De nada! Si necesitás otro valor, avisame."
    - text: "¡Un placer! ¿Alguna otra moneda que quieras consultar?"

  utter_preguntar_bienestar:
    - text: "¡Muy bien! Siempre atento al mercado. ¿Y vos cómo estás?"
    - text: "¡Todo tranqui por acá, viendo cómo suben y bajan las velas! ¿Vos qué tal?"
    - text: "¡Muy bien! Siempre listo para el mercado. ¿Y vos, cómo va todo?"

  utter_iamabot:
    - text: "Soy un bot especializado en criptomonedas, programado para este trabajo práctico."

  utter_fuera_de_tema:
    - text: "Por ahora mi fuerte son las finanzas y las criptomonedas. ¿Te gustaría saber el precio de algún activo?"

  utter_consultar_precio_placeholder:
    - text: "Entendido, estoy buscando el valor actual..."

actions:
  - action_consultar_precio

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
